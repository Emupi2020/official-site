<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>リクエスト管理 | Emupi</title><link rel="stylesheet" href="/style.css"><script src="/config.js"></script><script type="module" src="/admin.mjs"></script><link rel="icon" href="/favicon.svg"></head><body>
<header><a class="brand" href="https://emupi2020.github.io/official-site/">Emupi</a><span class="small muted">管理者専用</span></header>
<main class="admin-main"><div id="message" class="message" role="status" hidden></div>
<section id="login" class="card" hidden><h2>配信者ログイン</h2><form id="login-form"><label for="password">パスワード</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button id="login-submit" class="primary" type="submit">ログイン</button></form></section>
<div id="dashboard" hidden><div class="row admin-top"><div><span id="round"></span> · <span id="status" class="status"></span><div class="small muted" id="counts"></div></div><button id="toggle" class="secondary">受付開始</button></div>
<section class="card draw-card admin-stage" aria-label="歌まねルーレット"><div class="wheel-wrap"><canvas id="wheel" width="800" height="800" role="img" aria-label="曲名ルーレット"></canvas><span class="wheel-center" aria-hidden="true">P</span></div><button id="draw" class="draw-button">回す</button>
<div id="result" hidden aria-live="polite"><div id="result-song" class="result-song"></div><div id="result-artist" class="result-artist"></div></div>
<details class="song-actions"><summary>操作</summary><div class="buttons"><button id="cant-sing" class="secondary">歌えない</button><button id="undo" class="secondary">戻す</button></div></details></section>
<details class="manage"><summary>管理・リクエスト一覧</summary><p class="private-name"><span class="badge">選ばれたリクエスト</span> <span id="result-name"></span></p><section class="card"><div class="buttons"><button id="next-round" class="secondary">次の受付回へ</button><button id="next-session" class="secondary">次回配信を開始</button></div><p class="small muted">受付回を変えても、今日歌った曲は保留のまま。次回配信を開始すると、保留を抽選に戻します。</p><div id="entries"></div></section><section class="card"><h2>入力候補</h2><p class="small muted">応募から自動登録された候補です。</p><div id="suggestions"></div></section><button id="logout" class="text-button">ログアウト</button></details>
</div><dialog id="cant-sing-dialog" aria-labelledby="cant-sing-title"><form method="dialog"><h2 id="cant-sing-title">歌えない理由</h2><div class="reason-options"><button value="unknown">知らない</button><button value="no_audio">音源なし</button><button value="cancel" class="text-button">キャンセル</button></div></form></dialog></main><footer>Emupi Official</footer></body></html>
