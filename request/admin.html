<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>リクエスト管理 | Emupi</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/bug-reports.css"><link rel="stylesheet" href="/roulette-tabs.css?result=actions"><script src="/config.js"></script><script type="module" src="/admin.mjs?view=processed-requests"></script><script type="module" src="/bug-reports.mjs"></script><link rel="icon" href="/favicon.svg"></head><body>
<header><a class="brand" href="https://emupi2020.github.io/official-site/">Emupi</a><span class="small muted">管理者専用</span></header>
<main class="admin-main"><div id="message" class="message" role="status" hidden></div>
<section id="login" class="card" hidden><h2>配信者ログイン</h2><form id="login-form"><label for="password">パスワード</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button id="login-submit" class="primary" type="submit">ログイン</button></form></section>
<div id="dashboard" hidden>
<div class="row admin-top"><div><h1>リクエスト</h1><span id="round"></span> · <span id="status" class="status"></span><div class="small muted" id="counts"></div></div></div>
<section class="request-table-card" aria-labelledby="admin-yamapi-heading">
  <h2 id="admin-yamapi-heading">山Pの歌まね</h2>
  <div class="table-scroll"><table class="request-table" aria-labelledby="admin-yamapi-heading">
    <thead><tr><th scope="col">曲・歌手</th><th scope="col">名前</th><th scope="col">状況</th><th scope="col">操作</th></tr></thead>
    <tbody id="entries-yamapi"></tbody>
  </table></div>
</section>
<section class="request-table-card" aria-labelledby="admin-other-heading">
  <h2 id="admin-other-heading">それ以外の歌まね</h2>
  <div class="table-scroll"><table class="request-table" aria-labelledby="admin-other-heading">
    <thead><tr><th scope="col">曲・歌手</th><th scope="col">名前</th><th scope="col">状況</th><th scope="col">操作</th></tr></thead>
    <tbody id="entries-other"></tbody>
  </table></div>
</section>
<button id="open-roulette" class="primary launch-roulette">ルーレット</button>
<section id="current-info" class="card" hidden><div id="selected-song" class="entry-title"></div><p id="result-name" class="small muted"></p></section>
<div class="buttons admin-song-actions"><button id="cant-sing" class="secondary">歌えない</button><button id="undo" class="secondary">戻す</button></div>
<p id="undo-feedback" class="small muted" role="status" hidden></p>
<section id="processed-requests" class="request-table-card manage" aria-labelledby="processed-requests-heading" hidden>
  <h2 id="processed-requests-heading">処理済みのリクエスト</h2>
  <div class="table-scroll"><table class="request-table" aria-labelledby="processed-requests-heading">
    <thead><tr><th scope="col">曲・歌手</th><th scope="col">名前</th><th scope="col">状況</th><th scope="col">操作</th></tr></thead>
    <tbody id="entries-processed"></tbody>
  </table></div>
</section>
<details id="admin-bug-reports" class="manage">
  <summary>バグ報告</summary>
  <button id="refresh-bug-reports" type="button" class="text-button">更新</button>
  <p id="admin-bug-report-status" class="small muted" role="status" hidden></p>
  <ol id="bug-report-list"></ol>
  <button id="more-bug-reports" type="button" class="text-button" hidden>以前の報告を表示</button>
</details>
<details class="manage"><summary>受付・配信の管理</summary><section class="card"><div class="buttons"><button id="next-session" class="secondary">次回配信を開始</button></div><p class="small muted">回は全件処理後に自動で切り替わります。次回配信を開始すると、持ち越し分を抽選に戻します。</p></section><section class="card"><h2>入力候補</h2><div id="suggestions"></div></section><button id="logout" class="text-button">ログアウト</button></details>
</div>
<dialog id="roulette-screen" class="roulette-screen" aria-label="配信用ルーレット"><button id="close-roulette" class="roulette-close" aria-label="管理画面に戻る">×</button><div class="broadcast-wheel">
<div id="roulette-categories" class="roulette-categories" role="group" aria-label="抽選対象">
  <button type="button" value="all" aria-pressed="false">両方</button>
  <button type="button" value="yamapi" aria-pressed="true">山P</button>
  <button type="button" value="other" aria-pressed="false">それ以外</button>
</div>
<div class="wheel-wrap"><canvas id="wheel" width="800" height="800" role="img" aria-label="曲名ルーレット"></canvas><button id="draw" class="wheel-center" type="button" aria-label="回す"><span aria-hidden="true">P</span></button></div></div><div id="roulette-message" class="message" role="status" hidden></div><div id="result" class="winner-overlay" hidden aria-live="polite"><section class="winner-card" aria-label="抽選結果"><button id="dismiss-result" class="winner-dismiss" aria-label="抽選結果を閉じる">×</button><div id="result-song" class="result-song"></div><div id="result-artist" class="result-artist"></div>
  <div class="winner-actions buttons">
    <button id="result-cant-sing" class="secondary" type="button">歌えない</button>
    <button id="result-defer" class="secondary" type="button">次回歌う</button>
  </div>
</section></div></dialog>
<dialog id="cant-sing-dialog" aria-labelledby="cant-sing-title"><form method="dialog"><h2 id="cant-sing-title">歌えない理由</h2><div class="reason-options"><button value="unknown">知らない</button><button value="no_audio">音源なし</button><button value="cancel" class="text-button">キャンセル</button></div></form></dialog>
</main><footer>Emupi Official</footer></body></html>
