<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>リクエスト管理 | Emupi</title><link rel="stylesheet" href="/style.css"><script src="/config.js"></script><script type="module" src="/admin.mjs"></script><link rel="icon" href="/favicon.svg"></head><body>
<header><a class="brand" href="https://emupi2020.github.io/official-site/">Emupi</a><span class="small muted">管理者専用</span></header>
<main class="admin-main"><div id="message" class="message" role="status" hidden></div>
<section id="login" class="card" hidden><h2>配信者ログイン</h2><form id="login-form"><label for="password">パスワード</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button id="login-submit" class="primary" type="submit">ログイン</button></form></section>
<div id="dashboard" hidden>
<div class="row admin-top"><div><h1>リクエスト</h1><span id="round"></span> · <span id="status" class="status"></span><div class="small muted" id="counts"></div></div><button id="toggle" class="secondary">受付開始</button></div>
<section class="request-table-card" aria-label="リクエスト一覧"><div class="table-scroll"><table class="request-table"><thead><tr><th scope="col">曲・歌手</th><th scope="col">名前</th><th scope="col">状況</th><th scope="col">操作</th></tr></thead><tbody id="entries"></tbody></table></div></section>
<button id="open-roulette" class="primary launch-roulette">ルーレット</button>
<section id="current-info" class="card" hidden><div id="selected-song" class="entry-title"></div><p id="result-name" class="small muted"></p></section>
<div class="buttons admin-song-actions"><button id="cant-sing" class="secondary">歌えない</button><button id="undo" class="secondary">戻す</button></div>
<details class="manage"><summary>受付・配信の管理</summary><section class="card"><div class="buttons"><button id="next-round" class="secondary">次の受付回へ</button><button id="next-session" class="secondary">次回配信を開始</button></div><p class="small muted">受付回を変えても、今日歌った曲は保留のまま。次回配信を開始すると、保留を抽選に戻します。</p></section><section class="card"><h2>入力候補</h2><div id="suggestions"></div></section><button id="logout" class="text-button">ログアウト</button></details>
</div>
<dialog id="roulette-screen" class="roulette-screen" aria-label="配信用ルーレット"><button id="close-roulette" class="roulette-close" aria-label="管理画面に戻る">×</button><div class="broadcast-wheel"><div class="wheel-wrap"><canvas id="wheel" width="800" height="800" role="img" aria-label="曲名ルーレット"></canvas><span class="wheel-center" aria-hidden="true">P</span></div><button id="draw" class="draw-button">回す</button></div><div id="roulette-message" class="message" role="status" hidden></div><div id="result" class="winner-overlay" hidden aria-live="polite"><section class="winner-card" aria-label="抽選結果"><button id="dismiss-result" class="winner-dismiss" aria-label="抽選結果を閉じる">×</button><div id="result-song" class="result-song"></div><div id="result-artist" class="result-artist"></div></section></div></dialog>
<dialog id="cant-sing-dialog" aria-labelledby="cant-sing-title"><form method="dialog"><h2 id="cant-sing-title">歌えない理由</h2><div class="reason-options"><button value="unknown">知らない</button><button value="no_audio">音源なし</button><button value="cancel" class="text-button">キャンセル</button></div></form></dialog>
</main><footer>Emupi Official</footer></body></html>
